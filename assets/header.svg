<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Gourav">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111320"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#22d3ee;#f472b6;#a78bfa" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#f472b6;#a78bfa;#22d3ee" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#a78bfa;#22d3ee;#f472b6" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#22d3ee;#ec4899;#8b5cf6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#ec4899;#8b5cf6;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="1" y="1" width="998" height="258" rx="23"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>

    <g filter="url(#soft)">
      <circle cx="200" cy="80" r="72" fill="#8b5cf6" opacity="0.40">
        <animate attributeName="cx" values="200;300;200" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="80;150;80" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="800" cy="190" r="78" fill="#22d3ee" opacity="0.30">
        <animate attributeName="cx" values="800;700;800" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="190;120;190" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="40" r="55" fill="#ec4899" opacity="0.22">
        <animate attributeName="cx" values="520;440;520" dur="13s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="190" y="158" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="66" font-weight="700" fill="#8b5cf6" filter="url(#glow)">&lt;
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" repeatCount="indefinite"/>
    </text>
    <text x="810" y="158" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="66" font-weight="700" fill="#22d3ee" filter="url(#glow)">&gt;
      <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
    </text>

    <text x="500" y="152" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="90" font-weight="800" letter-spacing="12" fill="url(#nameGrad)" filter="url(#glow)">GOURAV</text>

    <rect x="420" y="184" width="160" height="6" rx="3" fill="url(#barGrad)"/>

    <g fill="#f0abfc">
      <path transform="translate(330,64) scale(1.1)" d="M0 -7 L1.7 -1.7 L7 0 L1.7 1.7 L0 7 L-1.7 1.7 L-7 0 L-1.7 -1.7 Z">
        <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="0s" repeatCount="indefinite"/>
      </path>
      <path transform="translate(672,74) scale(0.9)" d="M0 -7 L1.7 -1.7 L7 0 L1.7 1.7 L0 7 L-1.7 1.7 L-7 0 L-1.7 -1.7 Z" fill="#67e8f9">
        <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
      </path>
      <path transform="translate(250,196) scale(0.8)" d="M0 -7 L1.7 -1.7 L7 0 L1.7 1.7 L0 7 L-1.7 1.7 L-7 0 L-1.7 -1.7 Z" fill="#67e8f9">
        <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="2s" repeatCount="indefinite"/>
      </path>
      <path transform="translate(760,200) scale(1)" d="M0 -7 L1.7 -1.7 L7 0 L1.7 1.7 L0 7 L-1.7 1.7 L-7 0 L-1.7 -1.7 Z">
        <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
      </path>
      <path transform="translate(500,226) scale(0.7)" d="M0 -7 L1.7 -1.7 L7 0 L1.7 1.7 L0 7 L-1.7 1.7 L-7 0 L-1.7 -1.7 Z" fill="#67e8f9">
        <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="2.6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <rect x="1" y="1" width="998" height="258" rx="23" fill="none" stroke="url(#edge)" stroke-width="2"/>
</svg>
